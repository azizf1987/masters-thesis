<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thesis Defense — Spatial Air Quality Estimation & IoT Placement</title>
<style>
/* ============ Fonts & tokens ============ */
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&family=Roboto+Flex:opsz,wght@8..144,400..900&display=swap');

:root {
  --primary:#3355D8; --on-primary:#FFFFFF;
  --primary-container:#DEE3FF; --on-primary-container:#00105C;
  --secondary:#575E76; --secondary-container:#DDE1F9; --on-secondary-container:#151B2E;
  --tertiary:#8C4A6D; --tertiary-container:#FFD8E9; --on-tertiary-container:#38102A;

  --surface:#FCFBFF; --surface-container-lowest:#FFFFFF;
  --surface-container-low:#F6F5FB; --surface-container:#F0EEF6;
  --surface-container-high:#EAE8F1; --surface-container-highest:#E4E2EB;
  --on-surface:#1B1B21; --on-surface-variant:#46464F;
  --outline:#787680; --outline-variant:#C8C6D0;

  --e1: 0 1px 2px 0 rgba(0,0,0,.28), 0 1px 3px 1px rgba(0,0,0,.13);
  --e2: 0 1px 2px 0 rgba(0,0,0,.28), 0 2px 6px 2px rgba(0,0,0,.13);
  --e3: 0 1px 3px rgba(0,0,0,.28), 0 4px 10px 3px rgba(0,0,0,.13);

  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:26px; --r-full:999px;
  font-size:16px;
}
html.fs-large { font-size:18px; }
html.fs-larger { font-size:20px; }

[data-theme="teal"] {
  --primary:#00696C; --primary-container:#9DF1F1; --on-primary-container:#002020;
  --secondary:#4A6363; --secondary-container:#CCE8E7; --on-secondary-container:#051F1F;
  --tertiary:#4B5F7E; --tertiary-container:#D6E3FF; --on-tertiary-container:#0B1D34;
}
[data-theme="warm"] {
  --primary:#8B5000; --primary-container:#FFDDB3; --on-primary-container:#2C1600;
  --secondary:#6F5B40; --secondary-container:#FBDFBA; --on-secondary-container:#271904;
  --tertiary:#51643F; --tertiary-container:#D3EABB; --on-tertiary-container:#101F04;
}

/* ============ Reset / base ============ */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; border:0; }
body{
  min-height:100dvh; background:var(--surface); color:var(--on-surface);
  font-family:'Roboto', system-ui, sans-serif; overflow-x:hidden;
  display:flex; flex-direction:column; position:relative;
}
.ambient{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%, color-mix(in srgb, var(--primary) 7%, transparent) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 100% 100%, color-mix(in srgb, var(--tertiary) 6%, transparent) 0%, transparent 60%);
  transition: background .3s;
}

/* ============ Top bar ============ */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:.7rem 1.35rem;
  background:color-mix(in srgb, var(--surface) 78%, transparent);
  backdrop-filter:blur(12px) saturate(1.4);
  border-bottom:1px solid var(--outline-variant);
}
.counter{ font-size:.68rem; font-weight:600; letter-spacing:.04em; color:var(--on-surface-variant); font-variant-numeric:tabular-nums; }
.controls{ display:flex; align-items:center; gap:.55rem; }

.btn{
  display:inline-flex; align-items:center; gap:.4rem;
  height:2rem; padding:0 .8rem; border-radius:var(--r-full);
  border:1px solid var(--outline); background:transparent; color:var(--on-surface);
  font-size:.68rem; font-weight:600; cursor:pointer; transition:background .15s, box-shadow .15s;
}
.btn:hover{ background:var(--surface-container-high); }
.btn-filled{ background:var(--primary); color:var(--on-primary); border-color:transparent; }
.btn-filled:hover{ box-shadow:var(--e1); filter:brightness(1.04); }

.fs-group{ display:flex; border:1px solid var(--outline-variant); border-radius:var(--r-full); overflow:hidden; }
.fs-group button{ border:none; background:transparent; padding:.36rem .62rem; font-size:.64rem; font-weight:700; color:var(--on-surface-variant); cursor:pointer; }
.fs-group button.on{ background:var(--secondary-container); color:var(--on-secondary-container); }

.themes{ display:flex; align-items:center; gap:6px; }
.theme-dot{ width:18px; height:18px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; transition:transform .15s; }
.theme-dot:hover{ transform:scale(1.12); }
.theme-dot.on{ border-color:var(--on-surface); transform:scale(1.15); }

/* ============ Outline nav ============ */
/* Scoped to the nav element specifically — a bare .outline selector here would
   also match the unrelated "chip outline" badge variant (see .chip.outline
   below) and rip those badges out of the document flow into this fixed
   right-side rail. Keep this tag-qualified. */
nav.outline{
  position:fixed; right:.9rem; top:50%; transform:translateY(-50%); z-index:50;
  display:flex; flex-direction:column; align-items:flex-end; gap:.42rem;
}
nav.outline button{ display:flex; align-items:center; gap:.5rem; background:none; border:none; cursor:pointer; padding:2px; }
nav.outline .dot{ display:block; border-radius:50%; background:var(--outline-variant); width:7px; height:7px; transition:all .18s; }
nav.outline button:hover .dot{ background:var(--outline); }
nav.outline button.on .dot{ width:11px; height:11px; background:var(--primary); }
nav.outline .tip{
  font-size:.68rem; font-weight:500; color:var(--on-surface-variant);
  background:var(--surface-container-lowest); padding:4px 9px; border-radius:var(--r-sm);
  box-shadow:var(--e2); max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ============ Slide area ============ */
main.slide-area{
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; z-index:1;
  padding:4rem 2.6rem 4.5rem 1.1rem;
}
@media (min-width:768px){ main.slide-area{ padding-right:3.6rem; } }

.slide-view{ width:100%; display:flex; justify-content:center; animation:fadein .32s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
@keyframes slideR{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;} }
@keyframes slideL{ from{opacity:0; transform:translateX(-20px);} to{opacity:1; transform:none;} }
.slide-view.dir-r{ animation:slideR .26s ease; }
.slide-view.dir-l{ animation:slideL .26s ease; }

.slide-inner{ width:100%; max-width:58rem; padding:1.4rem 1rem 2rem; }
@media (min-width:640px){ .slide-inner{ padding-left:2rem; padding-right:2rem; } }
@media (min-width:768px){ .slide-inner{ padding:2rem 2.75rem; } }

.hint{ position:fixed; bottom:.9rem; left:50%; transform:translateX(-50%); font-size:.65rem; color:var(--on-surface-variant); z-index:2; }

/* ============ Typography ============ */
.kicker{
  display:inline-flex; align-items:center; gap:.4rem;
  text-transform:uppercase; letter-spacing:.11em; font-size:.68rem; font-weight:700;
  color:var(--primary); margin-bottom:.6rem;
}
.kicker::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--primary); }
.h1{ font-weight:900; font-size:clamp(1.7rem,3.3vw,2.55rem); line-height:1.14; color:var(--on-surface); letter-spacing:-.01em; margin:0 0 .9rem; }
.h2{ font-weight:800; font-size:clamp(1.45rem,2.5vw,1.95rem); line-height:1.2; color:var(--on-surface); letter-spacing:-.005em; margin:0 0 1.2rem; }
.subtitle{ font-size:1.2rem; font-weight:500; color:var(--on-surface-variant); margin:0 0 1.1rem; line-height:1.45; }
.meta{ font-size:.95rem; color:var(--on-surface-variant); margin:0 0 .3rem; }
.meta strong{ color:var(--on-surface); font-weight:700; }
.body{ font-size:1.02rem; line-height:1.65; color:var(--on-surface-variant); }
.lead{ font-size:1.12rem; line-height:1.6; color:var(--on-surface); margin:1rem 0 0; font-weight:500; }
strong.accent{ color:var(--primary); font-weight:700; }
em.muted{ color:var(--on-surface-variant); font-style:italic; }
.small-muted{ font-size:.85rem; color:var(--on-surface-variant); }
.mt-1{margin-top:.5rem;} .mt-2{margin-top:1rem;} .mb-0{margin-bottom:0;}

/* ============ Lists ============ */
.md-list{ list-style:none; display:flex; flex-direction:column; gap:.7rem; margin:0 0 1rem; }
.md-list li{ position:relative; padding-left:1.3rem; font-size:1.02rem; line-height:1.55; color:var(--on-surface-variant); }
.md-list li::before{ content:""; position:absolute; left:0; top:.55em; width:7px; height:7px; border-radius:50%; background:var(--primary); }
.md-list.tight li{ font-size:.95rem; }
.md-list strong{ color:var(--on-surface); font-weight:700; }

/* ============ Cards / grid ============ */
.grid-2{ display:grid; grid-template-columns:1fr; gap:1.6rem; }
@media (min-width:768px){ .grid-2{ grid-template-columns:1fr 1fr; } }
.grid-2.center{ align-items:center; }
.grid-3{ display:grid; grid-template-columns:1fr; gap:1rem; }
@media (min-width:768px){ .grid-3{ grid-template-columns:repeat(3,1fr); } }

.md-card{
  background:var(--surface-container-low); border:1px solid var(--outline-variant);
  border-radius:var(--r-lg); padding:1.15rem 1.35rem; box-shadow:var(--e1);
}
.md-card .ttl{ font-weight:800; font-size:1rem; color:var(--on-surface); margin-bottom:.4rem; display:flex; align-items:center; gap:.5rem; }
.md-card .ttl .swatch{ width:9px; height:9px; border-radius:50%; background:var(--primary); flex-shrink:0; }
.md-card p{ font-size:.92rem; line-height:1.55; color:var(--on-surface-variant); margin:0; }

/* ============ Callouts (tonal, for STRONG points) ============ */
.callout{
  display:flex; gap:.9rem; align-items:flex-start;
  background:var(--tertiary-container); color:var(--on-tertiary-container);
  border-radius:var(--r-lg); padding:1.1rem 1.3rem; box-shadow:var(--e1); margin:1rem 0;
}
.callout .icon{
  flex-shrink:0; width:2.1rem; height:2.1rem; border-radius:50%;
  background:color-mix(in srgb, var(--on-tertiary-container) 12%, transparent);
  display:flex; align-items:center; justify-content:center; font-size:1.1rem;
}
.callout .body-col{ min-width:0; }
.callout .label{ font-weight:800; text-transform:uppercase; letter-spacing:.08em; font-size:.66rem; margin-bottom:.3rem; opacity:.85; }
.callout p{ margin:0; font-size:.98rem; line-height:1.55; }
.callout.primary{ background:var(--primary-container); color:var(--on-primary-container); }
.callout.primary .icon{ background:color-mix(in srgb, var(--on-primary-container) 12%, transparent); }

/* ============ Chips ============ */
.chip-row{ display:flex; flex-wrap:wrap; gap:.5rem; margin:.8rem 0; }
.chip{
  display:inline-flex; align-items:center; gap:.35rem; padding:.38rem .85rem;
  border-radius:var(--r-full); background:var(--secondary-container); color:var(--on-secondary-container);
  font-size:.78rem; font-weight:700;
}
.chip.outline{ background:transparent; border:1px solid var(--outline); color:var(--on-surface-variant); }
.chip.primary{ background:var(--primary-container); color:var(--on-primary-container); }

/* ============ Stats ============ */
.stat-row{ display:flex; gap:1rem; flex-wrap:wrap; margin:1.1rem 0; }
.stat{
  flex:1; min-width:9.5rem; background:var(--surface-container); border:1px solid var(--outline-variant);
  border-radius:var(--r-lg); padding:1rem 1.15rem; box-shadow:var(--e1);
}
.stat .num{ font-size:1.85rem; font-weight:900; color:var(--primary); line-height:1.05; }
.stat .arrow{
  display:flex; align-items:baseline; gap:.5rem; font-weight:900; line-height:1.05;
}
.stat .arrow .from{ font-size:1.15rem; color:var(--on-surface-variant); font-weight:700; text-decoration:line-through; text-decoration-color:var(--outline); text-decoration-thickness:2px; }
.stat .arrow .to{ font-size:1.85rem; color:var(--primary); }
.stat .lbl{ font-size:.76rem; color:var(--on-surface-variant); margin-top:.4rem; font-weight:600; }
.stat-row.compact .stat{ min-width:0; }
.stat-row.compact .arrow{ flex-wrap:wrap; row-gap:.1rem; }
.stat-row.compact .num, .stat-row.compact .arrow .to{ font-size:1.4rem; }
.stat-row.compact .arrow .from{ font-size:.95rem; }

/* ============ RQ chain ============ */
.rq-chain{ display:flex; flex-direction:column; gap:.8rem; }
@media (min-width:768px){ .rq-chain{ flex-direction:row; align-items:stretch; } }
.rq-step{
  flex:1; background:var(--surface-container-low); border:1px solid var(--outline-variant);
  border-radius:var(--r-lg); padding:1.1rem 1.25rem; box-shadow:var(--e1); position:relative;
}
.rq-step .tag{ display:inline-block; font-size:.7rem; font-weight:900; color:var(--on-primary); background:var(--primary); border-radius:var(--r-full); padding:.2rem .65rem; margin-bottom:.55rem; }
.rq-step p{ font-size:.92rem; line-height:1.5; color:var(--on-surface-variant); margin:0; }
.rq-arrow{ display:none; align-items:center; justify-content:center; color:var(--outline); font-size:1.4rem; font-weight:900; padding:0 .1rem; }
@media (min-width:768px){ .rq-arrow{ display:flex; } }

/* ============ Table ============ */
.md-table-wrap{ border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--outline-variant); box-shadow:var(--e1); margin:1rem 0; }
table.md-table{ width:100%; border-collapse:collapse; background:var(--surface-container-lowest); }
.md-table th{ background:var(--surface-container-high); text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--on-surface-variant); padding:.7rem .95rem; font-weight:800; }
.md-table td{ padding:.7rem .95rem; border-top:1px solid var(--outline-variant); font-size:.88rem; color:var(--on-surface); vertical-align:top; }
.md-table td.lbl-cell{ font-weight:700; white-space:nowrap; }
.md-table th.num, .md-table td.num{ text-align:right; }

/* ============ Figures / image with graceful fallback ============ */
.md-figure{ margin:1rem auto 0; width:100%; }
.md-figure.narrow{ max-width:38rem; }
.md-img-wrap{
  position:relative; border-radius:var(--r-lg); overflow:hidden;
  border:1px solid var(--outline-variant); background:var(--surface-container);
  box-shadow:var(--e2); min-height:190px;
}
.md-img-wrap img{ width:100%; height:auto; max-height:min(48vh,420px); object-fit:contain; display:block; }
.md-img-wrap svg{ width:100%; height:auto; max-height:min(48vh,420px); display:block; }
.md-img-wrap.md-img-wrap-tall svg, .md-img-wrap.md-img-wrap-tall img{ max-height:min(74vh,680px); }
.chart-pair{ display:flex; flex-direction:column; gap:.5rem; margin-top:1rem; }
.chart-pair .chart-item{ display:flex; flex-direction:column; }
.chart-pair .chart-label{ font-size:.8rem; font-weight:700; letter-spacing:.02em; color:var(--on-surface-variant); text-align:center; margin-bottom:.15rem; }
.chart-pair .md-img-wrap img{ max-height:min(21vh,190px); }
.hero-caption{
  position:absolute; left:0; right:0; bottom:0; padding:.55rem .9rem;
  font-size:.72rem; font-weight:600; letter-spacing:.01em; color:var(--on-primary); text-align:center;
  background:linear-gradient(to top, color-mix(in srgb, var(--on-surface) 60%, transparent), transparent);
}
.md-img-fallback{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.65rem;
  min-height:200px; padding:1.6rem 2rem; text-align:center;
}
.md-img-fallback .ic{
  width:2.6rem; height:2.6rem; border-radius:50%; background:var(--primary-container); color:var(--on-primary-container);
  display:flex; align-items:center; justify-content:center; font-size:1.25rem; flex-shrink:0;
}
.md-img-fallback .desc{ font-size:.82rem; line-height:1.55; color:var(--on-surface-variant); max-width:36rem; }
.md-img-fallback .desc b{ color:var(--on-surface); }
figcaption.cap{ margin-top:.6rem; text-align:center; font-size:.85rem; color:var(--on-surface-variant); font-style:italic; }

/* ============ Print ============ */
.print-only{ display:none; }
@media print{
  .ambient, .topbar, nav.outline, .hint, .slide-area{ display:none !important; }
  .print-only{ display:block !important; }
  @page{ margin:10mm; size:landscape; }
  html, body{ background:var(--surface) !important; height:auto !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .print-page{ min-height:100vh; box-sizing:border-box; padding:1.25rem 2rem; break-after:page; display:flex; flex-direction:column; justify-content:center; }
  .print-page:last-child{ break-after:auto; }
  .print-inner{ width:100%; max-width:64rem; margin:0 auto; }
  .print-inner .grid-2, .print-inner .grid-3, .print-inner figure{ break-inside:avoid; page-break-inside:avoid; }
  .print-inner img{ max-height:34vh !important; width:auto !important; max-width:100% !important; object-fit:contain; }
  .print-inner table{ font-size:9pt !important; }
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>

<div class="ambient" aria-hidden="true"></div>

<header class="topbar">
  <span id="counter" class="counter"></span>
  <div class="controls">
    <button type="button" class="btn" id="btnPdf" title="Opens the print dialog — choose Save as PDF">Export PDF</button>
    <div class="fs-group" role="group" aria-label="Slide text size">
      <button type="button" data-fs="default">100%</button>
      <button type="button" data-fs="large">112%</button>
      <button type="button" data-fs="larger">125%</button>
    </div>
    <div class="themes" role="group" aria-label="Theme">
      <button type="button" class="theme-dot on" data-theme="default" style="background:#3355D8" title="Indigo" aria-label="Switch to Indigo theme"></button>
      <button type="button" class="theme-dot" data-theme="teal" style="background:#00696C" title="Teal" aria-label="Switch to Teal theme"></button>
      <button type="button" class="theme-dot" data-theme="warm" style="background:#8B5000" title="Amber" aria-label="Switch to Amber theme"></button>
    </div>
  </div>
</header>

<nav class="outline" id="outline" aria-label="Slide outline"></nav>

<main class="slide-area" id="mainLive">
  <div class="slide-view" id="slideView">
    <div class="slide-inner" id="slideHost"></div>
  </div>
</main>

<footer class="hint">&larr; &rarr; or click dots to navigate</footer>
<div class="print-only" id="printStack" aria-hidden="true"></div>

this single HTML file — no external files, no ./figures/ folder
required for the deck to display correctly anywhere (this chat,
double-clicked from disk, emailed as one file, etc.).

The title-slide hero (s0), the feature-groups diagram (s9), the
spatial-LOO comparison (s11), and the station map (s15) are inline SVG
(s0: dot-map of Sweden, sparse north/dense south; s9: six feature-
group icons converging into the model; s11: random-split-vs-
buffered-hold-out two-panel comparison; s15: the real 34 SMHI
stations plotted from their actual coordinates in
data/processed/station_features.csv, with the 11 analytical
stations from data/results/station_metrics.csv highlighted).

The three real result figures (decay curve, placement map, coverage
before/after — originally writing/images/fig_decay_pm25.png,
fig_placement_map.png, fig_coverage_before_after.png) are embedded
directly as base64 data URIs in their <img src="..."> attributes
below, rather than referencing ./figures/*.jpg on disk. This was
changed on 2026-08-21 specifically so the deck previews correctly as
a standalone file (e.g. in a chat file card) and never depends on a
sibling folder being present. If any of the three source PNGs are
regenerated later, the fix is to re-encode and swap the base64 blob,
not to reintroduce a ./figures/ path.
============================================================= -->

          </linearGradient>

          </radialGradient>
          <clipPath id="swedenClip">

                     C592,466 540,470 552,516 C564,562 602,566 588,614 C574,662 522,672 528,714
                     C534,754 490,772 456,752 C420,730 428,684 408,650 C386,612 400,566 380,528
                     C358,486 372,436 352,396 C330,352 348,300 332,258 C314,212 336,164 326,120
                     C316,76 356,42 404,38 C420,36.5 435,35.5 450,35 C466,34.4 482,34.6 498,34 Z"/>
          </clipPath>
          <pattern id="dotSparse" width="34" height="34" patternUnits="userSpaceOnUse">
            <circle cx="17" cy="17" r="2" fill="var(--on-primary)" opacity="0.34"/>
          </pattern>
          <pattern id="dotMid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="10" cy="10" r="2" fill="var(--on-primary)" opacity="0.5"/>

<template id="s1"><div class="slide-root">
  <span class="kicker">The problem</span>
  <h2 class="h2">Between stations, nobody knows the air</h2>
  <ul class="md-list">
    <li>SMHI's reference network is accurate but sparse &mdash; stations can be <strong>tens of km apart</strong></li>
    <li>The space between stations is unmonitored; air quality there is only ever a guess</li>
    <li>Cheap IoT sensors could fill the gap, but today they get placed by <strong>convenience</strong>, not analysis</li>
  </ul>
  <p class="lead">This thesis builds the missing decision rule: where does a sensor actually help?</p>
</div></template>
<template id="s2"><div class="slide-root">
  <span class="kicker">Why it matters</span>
  <h2 class="h2">Low concentrations, real health cost</h2>
  <ul class="md-list">
    <li>PM2.5 and NO2 are linked to respiratory and cardiovascular disease, even at Sweden's comparatively low levels</li>
    <li>Studies in Stockholm, Gothenburg and Ume&aring; show measurable attributable mortality from traffic-related exposure</li>
    <li>Exposure varies sharply <em class="muted">within</em> a city &mdash; a handful of national stations can't see that</li>
  </ul>
  <div class="chip-row">
    <span class="chip outline">Segersson et al., 2017</span>
  </div>
</div></template>
<template id="s3"><div class="slide-root">
  <span class="kicker">What's already out there</span>
  <h2 class="h2">Three ways to estimate the gap</h2>
  <div class="grid-3">
    <div class="md-card"><div class="ttl"><span class="swatch"></span>IDW</div><p>Distance-weighted average of nearby stations. No assumptions, the standard baseline.</p></div>
    <div class="md-card"><div class="ttl"><span class="swatch"></span>LUR</div><p>Land-Use Regression &mdash; Europe's established peer-reviewed standard, calibrated across 20 study areas (ESCAPE).</p></div>
    <div class="md-card"><div class="ttl"><span class="swatch"></span>Machine Learning</div><p>Captures non-linear patterns; literature shows it often beats LUR on accuracy.</p></div>
  </div>
  <p class="lead">But which one wins depends entirely on how you test it &mdash; and that's where this gets interesting.</p>
</div></template>
<template id="s4"><div class="slide-root">
  <span class="kicker">A methodological trap</span>
  <h2 class="h2">Why random testing lies to you</h2>
  <div class="callout">
    <div class="icon">&#9888;</div>
    <div class="body-col">
      <p class="label">The trap</p>
      <p>Randomly splitting stations into train/test looks rigorous &mdash; but nearby stations look alike. The model quietly sees a preview of the answer through its neighbors.</p>
    </div>
  </div>
  <p class="body">The fix: hide a whole <strong class="accent">neighborhood</strong> around each test station, not just the station itself (Roberts et al., 2017). This becomes the backbone of the entire validation strategy.</p>
</div></template>
<template id="s5"><div class="slide-root">
  <span class="kicker">The gap</span>
  <h2 class="h2">Nobody had chained these together</h2>
  <ul class="md-list">
    <li>Plenty of research estimates pollution at unmonitored spots</li>
    <li>Plenty of research optimizes sensor placement</li>
    <li>Nobody uses a <strong>measured accuracy-vs-distance relationship</strong>, at national scale, on public data, as the actual placement rule</li>
  </ul>
  <div class="callout primary">
    <div class="icon">&#128161;</div>
    <div class="body-col">
      <p class="label">The opening</p>
      <p>This thesis is the missing link between &ldquo;how good is our estimate&rdquo; and &ldquo;so where do we put the next sensor.&rdquo;</p>
    </div>
  </div>
</div></template>
<template id="s6"><div class="slide-root">
  <span class="kicker">Research questions</span>
  <h2 class="h2">Three questions, one chain</h2>
  <div class="rq-chain">
    <div class="rq-step"><span class="tag">RQ1</span><p>How accurately can we estimate PM2.5 &amp; NO2 at a station, using only the other stations?</p></div>
    <div class="rq-arrow">&rarr;</div>
    <div class="rq-step"><span class="tag">RQ2</span><p>How does that accuracy decay with distance &mdash; and where's the cutoff?</p></div>
    <div class="rq-arrow">&rarr;</div>
    <div class="rq-step"><span class="tag">RQ3</span><p>Using that cutoff, where should new sensors go?</p></div>
  </div>
</div></template>
<template id="s7"><div class="slide-root">
  <span class="kicker">Research design</span>
  <h2 class="h2">Design Science Research</h2>
  <div class="md-table-wrap"><table class="md-table"><thead><tr><th>Phase</th><th>This thesis</th></tr></thead><tbody>
    <tr><td class="lbl-cell">Problem &amp; objectives</td><td>The coverage gap between SMHI stations, framed into three RQs</td></tr>
    <tr><td class="lbl-cell">Design &amp; development</td><td>Random Forest model + accuracy-distance decay curve + greedy placement algorithm</td></tr>
    <tr><td class="lbl-cell">Demonstration</td><td>Applied nationally across the whole of Sweden</td></tr>
    <tr><td class="lbl-cell">Evaluation</td><td>Judged by real-world coverage gained, not just model accuracy scores</td></tr>
  </tbody></table></div>
  <p class="lead">The output has to work as a useful tool, not just score well as a model.</p>
</div></template>
<template id="s8"><div class="slide-root">
  <span class="kicker">A modelling decision</span>
  <h2 class="h2">Two pollutants, two models</h2>
  <div class="grid-2">
    <div class="md-card"><div class="ttl"><span class="swatch"></span>NO2</div><p>Traffic-sourced &middot; sharp gradients &middot; concentrated close to roads, fades fast with distance</p></div>
    <div class="md-card"><div class="ttl"><span class="swatch"></span>PM2.5</div><p>Mixed regional sources &middot; smooth gradients &middot; spreads gradually over tens of kilometres</p></div>
  </div>
  <p class="lead">Different physics, so separate models throughout &mdash; merging them would blur two real patterns into one average.</p>
</div></template>

<template id="s10"><div class="slide-root">
  <span class="kicker">Choosing the estimator</span>
  <h2 class="h2">Random Forest, deliberately</h2>
  <ul class="md-list">
    <li>Handles mixed feature types without assuming straight-line relationships</li>
    <li>Doesn't fall apart on a small, oddly-shaped dataset &mdash; only 11 usable stations</li>
    <li>Deep learning and hybrid Kriging models were <strong>excluded</strong>: they need far more training locations than Sweden's network offers</li>
  </ul>
  <p class="lead">Matching model complexity to data availability &mdash; not chasing the fanciest option available.</p>
</div></template>

<template id="s12"><div class="slide-root">
  <span class="kicker">Choosing where sensors go</span>
  <h2 class="h2">Greedy, on purpose</h2>
  <ul class="md-list">
    <li>At each step, place the sensor that closes the <strong>biggest remaining gap</strong></li>
    <li>Chosen over swarm-based optimization (PSO) for two reasons: <strong>transparency</strong> and a <strong>provable guarantee</strong></li>
    <li>A planner can see exactly why each sensor was recommended &mdash; no black box to trust</li>
    <li>For this class of coverage objective, greedy search is mathematically guaranteed to land within a <strong>constant factor of the true optimum</strong> &mdash; not just a heuristic hope</li>
  </ul>
  <div class="chip-row">
    <span class="chip primary">Greedy &middot; transparent, provably near-optimal</span>
    <span class="chip outline">PSO &middot; possibly better, harder to explain</span>
  </div>
</div></template>

<template id="s16"><div class="slide-root">
  <span class="kicker">Answering RQ1</span>
  <h2 class="h2">Accuracy, pollutant by pollutant</h2>
  <div class="grid-2">
    <div class="md-card">
      <div class="ttl"><span class="swatch"></span>NO2 &mdash; Random Forest wins</div>
      <p>Mean RMSE (&micro;g/m&sup3;): <strong>RF 7.27</strong> vs IDW 8.90 vs LUR 15.33</p>
    </div>
    <div class="md-card">
      <div class="ttl"><span class="swatch"></span>PM2.5 &mdash; distance-averaging wins</div>
      <p>Mean RMSE (&micro;g/m&sup3;): <strong>IDW 2.33</strong> vs RF 3.56 vs LUR 5.87</p>
    </div>
  </div>
</div></template>
<template id="s17"><div class="slide-root">
  <span class="kicker">Reading the result straight</span>
  <h2 class="h2">The simple method won where it mattered most</h2>
  <div class="callout">
    <div class="icon">&#128064;</div>
    <div class="body-col">
      <p class="label">Reported, not hidden</p>
      <p>PM2.5 is the pollutant the entire sensor-placement result rests on &mdash; and simple distance-averaging beat Random Forest on it, winning 10 of 11 stations. That's not a failure to bury; it's a finding: PM2.5 spreads smoothly enough that feature-based learning adds little over just averaging nearby stations.</p>
    </div>
  </div>
  <div class="callout">
    <div class="icon">&#128064;</div>
    <div class="body-col">
      <p class="label">Reported, not hidden</p>
      <p>NO2 tells a subtler story: Random Forest wins on <em class="muted">mean</em> RMSE, but IDW actually has the lower error at 7 of the 11 individual stations. RF's mean is pulled down by two isolated rural stations where it performs exceptionally well &mdash; IDW is competitive or ahead across the rest.</p>
    </div>
  </div>
</div></template>
<template id="s18"><div class="slide-root">
  <span class="kicker">Behind the numbers</span>
  <h2 class="h2">Choosing the decay curve: AIC picks the winner</h2>
  <div class="md-table-wrap"><table class="md-table"><thead><tr><th>Pollutant</th><th>Model</th><th>Best-fit form</th><th class="num">AIC</th><th class="num">BIC</th></tr></thead><tbody>
    <tr><td class="lbl-cell">NO2</td><td>RF</td><td>log</td><td class="num"><strong>60.68</strong></td><td class="num">61.47</td></tr>
    <tr><td class="lbl-cell">NO2</td><td>LUR</td><td>log</td><td class="num">83.51</td><td class="num">84.30</td></tr>
    <tr><td class="lbl-cell">NO2</td><td>IDW</td><td>log</td><td class="num">63.38</td><td class="num">64.18</td></tr>
    <tr><td class="lbl-cell">PM2.5</td><td>RF</td><td>exponential</td><td class="num"><strong>25.33</strong></td><td class="num">26.12</td></tr>
    <tr><td class="lbl-cell">PM2.5</td><td>LUR</td><td>log</td><td class="num">58.78</td><td class="num">59.58</td></tr>
    <tr><td class="lbl-cell">PM2.5</td><td>IDW</td><td>exponential</td><td class="num">38.55</td><td class="num">39.35</td></tr>
  </tbody></table></div>
  <div class="callout">
    <div class="icon">&#128269;</div>
    <div class="body-col">
      <p class="label">Not an assumed shape &mdash; a tested one</p>
      <p>Three candidate functional forms &mdash; logarithmic, power, and exponential &mdash; were fitted to each of the six pollutant/model combinations, eighteen fits in total. The form with the lowest AIC was kept for the decay curves and thresholds on the next slide. NO2's error-distance relationship is log-shaped for all three estimators; PM2.5 is exponential for RF and IDW, but log for LUR. The curve shape wasn't chosen to fit the story &mdash; it's what the data selected. Random Forest also posts the lowest AIC of the three models for <strong>both</strong> pollutants (60.68 for NO2, 25.33 for PM2.5) &mdash; its error-distance relationship is the cleanest fit of the three, even though IDW is still the more accurate estimator for PM2.5 on RMSE.</p>
    </div>
  </div>
  <p class="small-muted">n = 11 stations in every fit. Full candidate comparison &mdash; all three forms per combination, with fitted coefficients &mdash; is Table 7 in the thesis.</p>
</div></template>

<template id="s23"><div class="slide-root">
  <span class="kicker">The honest counterpart</span>
  <h2 class="h2">The same 20 sensors barely help NO2</h2>
  <div class="callout">
    <div class="icon">&#128064;</div>
    <div class="body-col">
      <p class="label">Reported, not hidden</p>
      <p>Checked against the stricter 6&nbsp;km NO2 threshold, the same 20 sensors move national NO2 land coverage only from <strong>0.2% to 0.6%</strong> &mdash; and urban NO2 coverage doesn't move at all, staying flat at <strong>6.1%</strong> before and after. A sensor plan sized for PM2.5 does not solve NO2 &mdash; and the thesis says so plainly, rather than letting the headline PM2.5 number imply otherwise.</p>
    </div>
  </div>
</div></template>
<template id="s24"><div class="slide-root">
  <span class="kicker">So what</span>
  <h2 class="h2">Two pollutants, two planning problems</h2>
  <ul class="md-list">
    <li>A PM2.5-sized deployment leaves NO2 exposure near traffic effectively unmonitored between stations</li>
    <li>Municipalities need to treat the two thresholds as <strong>separate constraints</strong>, not a shared budget</li>
    <li>Four newly served regions &mdash; J&ouml;nk&ouml;ping, &Ouml;rebro, Dalarna, Norrbotten &mdash; are concrete near-term priorities</li>
  </ul>
</div></template>
<template id="s25"><div class="slide-root">
  <span class="kicker">Where to press</span>
  <h2 class="h2">What this doesn't yet resolve</h2>
  <ul class="md-list">
    <li>Only <strong>11 stations</strong> carry every validation fold, decay curve, and threshold in the thesis</li>
    <li>The 5&nbsp;km exclusion buffer is justified by station clustering, not the true spatial-autocorrelation range</li>
    <li>The evaluation grid (10&nbsp;km) is coarser than the NO2 threshold itself (6&nbsp;km)</li>
    <li>Straight-line distance stands in for road-network distance &mdash; more physically right for NO2, but not computable from this network</li>
    <li>The 50% criterion itself is a modelling choice, not a fixed rule &mdash; sweeping it 20&ndash;80% swings post-placement PM2.5 coverage from 2.9% to 94.7%</li>
  </ul>
</div></template>
<template id="s26"><div class="slide-root">
  <span class="kicker">The contribution</span>
  <h2 class="h2">One sentence</h2>
  <div class="callout primary">
    <div class="icon">&#127919;</div>
    <div class="body-col"><p>A reproducible method, built entirely on public data, that turns &ldquo;how accurate is our estimate at distance X&rdquo; into a ranked list of where to put the next sensor &mdash; demonstrated at the scale of an entire country.</p></div>
  </div>
  <div class="chip-row">
    <span class="chip outline">Not claimed: an operational deployment plan</span>
    <span class="chip outline">Not claimed: a regulatory compliance tool</span>
  </div>
</div></template>
<template id="s27"><div class="slide-root">
  <span class="kicker">What's next</span>
  <h2 class="h2">Future work</h2>
  <ul class="md-list">
    <li>Validate against a denser reference network, or replicate in another country</li>
    <li>Jointly optimize placement for <strong>both</strong> pollutants instead of PM2.5 alone</li>
    <li>A finer national grid &mdash; fine enough to actually resolve the NO2 threshold</li>
    <li>Periodic recalibration as traffic patterns shift (e.g. vehicle electrification)</li>
  </ul>
</div></template>

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Go to slide: ' + title);
    const dot = document.createElement('span');
    dot.className = 'dot';
    btn.appendChild(dot);
    let tip = null;
    btn.addEventListener('mouseenter', () => {
      tip = document.createElement('span');
      tip.className = 'tip';
      tip.textContent = title;
      btn.insertBefore(tip, dot);
    });
    btn.addEventListener('mouseleave', () => { if (tip) { tip.remove(); tip = null; } });
    btn.addEventListener('click', () => go(i));
    outline.appendChild(btn);
  });

  function updateOutline() {
    [...outline.querySelectorAll('button')].forEach((b, i) => {
      b.classList.toggle('on', i === current);
      if (i === current) b.setAttribute('aria-current', 'step');
      else b.removeAttribute('aria-current');
    });
  }

  function go(idx) {
    if (idx < 0 || idx >= N || idx === current) return;
    dir = idx > current ? 'r' : 'l';
    current = idx;
    render();
  }

  function render() {
    counter.textContent = (current + 1) + ' / ' + N;
    slideView.classList.remove('dir-r', 'dir-l');
    if (dir === 'r') slideView.classList.add('dir-r');
    else if (dir === 'l') slideView.classList.add('dir-l');
    dir = 'none';
    const tmpl = document.getElementById('s' + current);
    host.innerHTML = '';
    host.appendChild(tmpl.content.cloneNode(true));
    updateOutline();
    void slideView.offsetWidth;
  }

  document.getElementById('btnPdf').addEventListener('click', () => window.print());

  document.querySelectorAll('.fs-group button').forEach((b) => {
    b.addEventListener('click', () => applyFont(b.getAttribute('data-fs')));
  });

  document.querySelectorAll('.theme-dot').forEach((b) => {
    b.addEventListener('click', () => applyTheme(b.getAttribute('data-theme')));
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault();
      go(current + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      go(current - 1);
    }
  });

  /* Build print stack */
  for (let i = 0; i < N; i++) {
    const page = document.createElement('div');
    page.className = 'print-page';
    const inner = document.createElement('div');
    inner.className = 'print-inner';
    const t = document.getElementById('s' + i);
    inner.appendChild(t.content.cloneNode(true));
    page.appendChild(inner);
    printStack.appendChild(page);
  }

  applyFont(readFont());
  applyTheme('default');
  render();
})();
</script>
</body>
</html>
